name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v2022.0.1 (leave empty for an automatic version)"
        required: false
        type: string

permissions:
  contents: write

env:
  QT_VERSION: "5.15.2"

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set release version
        id: version
        shell: pwsh
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $requested = "$env:REQUESTED_RELEASE_TAG".Trim()
          if (-not [string]::IsNullOrWhiteSpace($requested)) {
            $tag = $requested
          } elseif ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "v2022.0.$env:GITHUB_RUN_NUMBER"
          }

          if (-not $tag.StartsWith("v")) {
            $tag = "v$tag"
          }
          if ($tag -notmatch '^v\d+(\.\d+){0,2}([-.][0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            throw "Release tag '$tag' is not a supported version tag."
          }

          # NSIS requires a numeric x.y.z version for the executable metadata.
          $base = $tag.TrimStart("v").Split("-")[0]
          $parts = @($base.Split(".") | Where-Object { $_ -match "^\d+$" })
          if ($parts.Count -lt 1) {
            throw "Release tag '$tag' does not contain a numeric version."
          }
          while ($parts.Count -lt 3) {
            $parts += "0"
          }
          $numericVersion = ($parts | Select-Object -First 3) -join "."

          "release_tag=$tag" >> $env:GITHUB_OUTPUT
          "app_version=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT
          "numeric_version=$numericVersion" >> $env:GITHUB_OUTPUT

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2019_64
          modules: qtcharts
          cache: true
          cache-key-prefix: qt-5.15.2-full

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: x64

      - name: Prepare Python build path
        shell: pwsh
        run: |
          # The 2022 qmake project links against C:\Python38-x64.
          if (Test-Path -LiteralPath "C:\Python38-x64") {
            Remove-Item -LiteralPath "C:\Python38-x64" -Recurse -Force
          }
          New-Item -ItemType Junction -Path "C:\Python38-x64" -Target $env:pythonLocation
          python --version
          python -m pip install "pip==24.0" "setuptools<76" wheel

      - name: Build third-party libraries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cmakePolicy = "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
          $generator = "Visual Studio 17 2022"

          Invoke-WebRequest `
            -Uri "https://www.nuget.org/api/v2/package/zlib-msvc14-x64/1.2.11.7795" `
            -OutFile "$env:RUNNER_TEMP\zlib.zip"
          Expand-Archive `
            -LiteralPath "$env:RUNNER_TEMP\zlib.zip" `
            -DestinationPath "3rdparty\zlib-msvc14-x64.1.2.11.7795"

          Push-Location "3rdparty\lz4\build\cmake"
          try {
            cmake -G $generator -A x64 $cmakePolicy -DLZ4_BUNDLED_MODE=ON .
            if ($LASTEXITCODE -ne 0) { throw "LZ4 configure failed" }
            cmake --build . --config Release --parallel
            if ($LASTEXITCODE -ne 0) { throw "LZ4 build failed" }
          } finally {
            Pop-Location
          }

          Push-Location "3rdparty\zstd\build\cmake"
          try {
            cmake -G $generator -A x64 $cmakePolicy `
              -DZSTD_BUILD_PROGRAMS=OFF `
              -DZSTD_BUILD_SHARED=OFF `
              -DZSTD_BUILD_STATIC=ON `
              -DZSTD_BUILD_TESTS=OFF .
            if ($LASTEXITCODE -ne 0) { throw "Zstandard configure failed" }
            cmake --build . --config Release --parallel
            if ($LASTEXITCODE -ne 0) { throw "Zstandard build failed" }
          } finally {
            Pop-Location
          }

          Push-Location "3rdparty\snappy"
          try {
            cmake -G $generator -A x64 $cmakePolicy `
              -DSNAPPY_BUILD_TESTS=OFF `
              -DSNAPPY_BUILD_BENCHMARKS=OFF .
            if ($LASTEXITCODE -ne 0) { throw "Snappy configure failed" }
            cmake --build . --config Release --parallel
            if ($LASTEXITCODE -ne 0) { throw "Snappy build failed" }
          } finally {
            Pop-Location
          }

          Push-Location "3rdparty\brotli"
          try {
            cmake -G $generator -A x64 $cmakePolicy -DBUILD_SHARED_LIBS=OFF .
            if ($LASTEXITCODE -ne 0) { throw "Brotli configure failed" }
            cmake --build . --config Release --parallel
            if ($LASTEXITCODE -ne 0) { throw "Brotli build failed" }
          } finally {
            Pop-Location
          }

          $requiredLibraries = @(
            "3rdparty\zlib-msvc14-x64.1.2.11.7795\build\native\lib_release\zlibstatic.lib",
            "3rdparty\lz4\build\cmake\Release\lz4.lib",
            "3rdparty\zstd\build\cmake\lib\Release\zstd_static.lib",
            "3rdparty\snappy\Release\snappy.lib",
            "3rdparty\brotli\Release\brotlicommon-static.lib",
            "3rdparty\brotli\Release\brotlidec-static.lib",
            "3rdparty\brotli\Release\brotlienc-static.lib"
          )
          foreach ($library in $requiredLibraries) {
            if (-not (Test-Path -LiteralPath $library)) {
              throw "Expected dependency was not built: $library"
            }
          }

      - name: Build RESP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # This qredisclient revision compiles its bundled hiredis sources directly.
          Push-Location "src"
          try {
            qmake CONFIG+=release "VERSION=${{ steps.version.outputs.app_version }}"
            if ($LASTEXITCODE -ne 0) { throw "qmake failed" }
            nmake /S /NOLOGO release
            if ($LASTEXITCODE -ne 0) { throw "RESP compilation failed" }
          } finally {
            Pop-Location
          }

      - name: Stage application and Python packages
        shell: pwsh
        env:
          DISTUTILS_USE_SDK: "1"
          MSSdk: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:GITHUB_WORKSPACE "build\windows\installer\resources"
          Get-ChildItem -LiteralPath $stage -Force | Remove-Item -Recurse -Force

          Copy-Item "bin\windows\release\resp.exe" $stage
          $pipLog = Join-Path $env:RUNNER_TEMP "python-dependencies.log"
          python -m pip install --target $stage -r "src\py\requirements.txt" 2>&1 |
            Tee-Object -FilePath $pipLog
          if ($LASTEXITCODE -ne 0) {
            $details = (Get-Content $pipLog -Tail 8) -join " | "
            $details = $details.Replace("%", "%25").Replace("`r", "").Replace("`n", "%0A")
            Write-Output "::error title=Python dependency installation failed::$details"
            exit 1
          }

      - name: Bundle Python runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:GITHUB_WORKSPACE "build\windows\installer\resources"

          Copy-Item "$env:pythonLocation\python38.dll" $stage -Force
          Get-ChildItem "$env:pythonLocation" -Filter "*.dll" -File |
            Copy-Item -Destination $stage -Force
          foreach ($directory in @($env:pythonLocation, "$env:pythonLocation\DLLs")) {
            if (Test-Path -LiteralPath $directory) {
              Get-ChildItem $directory -File |
                Where-Object { $_.Name -match '^(libssl|libcrypto)-.*\.dll$' } |
                Copy-Item -Destination $stage -Force
            }
          }
          foreach ($name in @("libssl-1_1", "libcrypto-1_1")) {
            $source = Join-Path $stage "$name.dll"
            if (Test-Path -LiteralPath $source) {
              Copy-Item -LiteralPath $source -Destination (Join-Path $stage "$name-x64.dll") -Force
            }
          }
          New-Item -ItemType Directory -Path "$stage\DLLs" -Force | Out-Null
          Copy-Item "$env:pythonLocation\DLLs\*" "$stage\DLLs" -Recurse -Force
          New-Item -ItemType Directory -Path "$stage\Lib" -Force | Out-Null
          Copy-Item "$env:pythonLocation\Lib\*" "$stage\Lib" -Recurse -Force

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:GITHUB_WORKSPACE "build\windows\installer\resources"
          Push-Location $stage
          try {
            windeployqt `
              --release `
              --compiler-runtime `
              --no-translations `
              --force `
              --qmldir "$env:GITHUB_WORKSPACE\src\qml" `
              "resp.exe"
            if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
          } finally {
            Pop-Location
          }

      - name: Verify deployment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:GITHUB_WORKSPACE "build\windows\installer\resources"
          $requiredDeployment = @(
            "resp.exe",
            "Qt5Charts.dll",
            "python38.dll",
            "libssl-1_1.dll",
            "libcrypto-1_1.dll",
            "libssl-1_1-x64.dll",
            "libcrypto-1_1-x64.dll",
            "platforms\qwindows.dll",
            "QtQuick.2\qtquick2plugin.dll",
            "QtQuick\Controls\qmldir",
            "QtCharts\qmldir"
          )
          foreach ($item in $requiredDeployment) {
            if (-not (Test-Path -LiteralPath (Join-Path $stage $item))) {
              Write-Output "::error title=Deployment incomplete::Missing required file: $item"
              exit 1
            }
          }

          Copy-Item "LICENSE" $stage

      - name: Smoke test deployment
        shell: pwsh
        env:
          QT_OPENGL: software
          QT_ASSUME_STDERR_HAS_CONSOLE: "1"
          QT_DEBUG_PLUGINS: "1"
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item Env:QML2_IMPORT_PATH,Env:QML_IMPORT_PATH,Env:QT_PLUGIN_PATH,Env:QT_QPA_PLATFORM_PLUGIN_PATH -ErrorAction SilentlyContinue
          $exe = Join-Path $env:GITHUB_WORKSPACE "build\windows\installer\resources\resp.exe"
          $stdout = Join-Path $env:RUNNER_TEMP "resp-smoke-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "resp-smoke-stderr.log"
          $process = Start-Process `
            -FilePath $exe `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru

          Start-Sleep -Seconds 15
          $process.Refresh()
          if ($process.HasExited) {
            throw "RESP exited during the smoke test with code $($process.ExitCode)."
          }

          $fatalLog = Select-String `
            -Path $stderr `
            -Pattern "QQmlApplicationEngine failed to load component|plugin cannot be loaded for module|Cannot install type|module .* is not installed" `
            -ErrorAction SilentlyContinue
          $platformLoaded = Select-String `
            -Path $stderr `
            -Pattern "loaded library .*qwindows.dll" `
            -ErrorAction SilentlyContinue
          $tlsLoaded = Select-String `
            -Path $stderr `
            -Pattern 'TLS support: "(?!")[^"]+"' `
            -ErrorAction SilentlyContinue
          if ($fatalLog -or -not $platformLoaded -or -not $tlsLoaded) {
            Stop-Process -Id $process.Id -Force
            Get-Content $stderr -Tail 200
            $details = if ($fatalLog) {
              ($fatalLog | Select-Object -First 12 | ForEach-Object { $_.Line }) -join " | "
            } elseif (-not $tlsLoaded) {
              "OpenSSL did not load. TLS support is empty."
            } else {
              "Windows platform plugin load message was not found."
            }
            $details = $details.Replace("%", "%25").Replace("`r", "").Replace("`n", "%0A")
            Write-Output "::error title=RESP smoke test failed::$details"
            exit 1
          }

          Stop-Process -Id $process.Id -Force

      - name: Upload smoke test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RESP-${{ steps.version.outputs.app_version }}-smoke-logs
          path: |
            ${{ runner.temp }}/resp-smoke-stdout.log
            ${{ runner.temp }}/resp-smoke-stderr.log
          if-no-files-found: ignore

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.app_version }}"
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "release"
          $portableDir = Join-Path $env:RUNNER_TEMP "RESP-$version-windows-x64"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
          Copy-Item "build\windows\installer\resources\*" $portableDir -Recurse
          Compress-Archive `
            -Path $portableDir `
            -DestinationPath (Join-Path $releaseDir "RESP-$version-windows-x64-portable.zip") `
            -CompressionLevel Optimal

      - name: Create installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.app_version }}"
          $numericVersion = "${{ steps.version.outputs.numeric_version }}"
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path -LiteralPath $makensis)) {
            choco install nsis --no-progress -y
            $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          }

          & $makensis /V2 "/DVERSION=$numericVersion" "build\windows\installer\installer.nsi"
          if ($LASTEXITCODE -ne 0) { throw "NSIS installer build failed" }

          $installer = Join-Path $env:GITHUB_WORKSPACE "build\windows\installer\resp-$numericVersion.exe"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Expected installer was not created: $installer"
          }
          Copy-Item `
            $installer `
            (Join-Path $env:GITHUB_WORKSPACE "release\RESP-$version-windows-x64-setup.exe")

      - name: Generate checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $lines = Get-ChildItem "release" -File |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          $lines | Set-Content "release\SHA256SUMS.txt" -Encoding ascii

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RESP-${{ steps.version.outputs.app_version }}-windows-x64
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: RESP ${{ steps.version.outputs.release_tag }}
          generate_release_notes: true
          files: |
            release/RESP-${{ steps.version.outputs.app_version }}-windows-x64-setup.exe
            release/RESP-${{ steps.version.outputs.app_version }}-windows-x64-portable.zip
            release/SHA256SUMS.txt
